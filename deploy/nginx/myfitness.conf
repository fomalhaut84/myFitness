# myFitness — Nginx reverse proxy config
#
# 초기 설치 (HTTP only):
#   sudo cp deploy/nginx/myfitness.conf /etc/nginx/sites-available/myfitness
#   sudo ln -s /etc/nginx/sites-available/myfitness /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL 설정 (certbot이 자동으로 HTTPS 블록 추가):
#   sudo certbot --nginx -d fitness.starryjeju.net

server {
    listen 80;
    server_name fitness.starryjeju.net;

    # gzip 압축
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_vary on;

    # Next.js 정적 파일 — 장기 캐시 (immutable hash 기반)
    location /_next/static/ {
        proxy_pass http://localhost:4200;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # favicon, 기타 정적 에셋
    location /favicon.ico {
        proxy_pass http://localhost:4200;
        expires 30d;
        access_log off;
    }

    # AI API — 긴 타임아웃 (Claude CLI 응답 대기)
    location /api/ai {
        proxy_pass http://localhost:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }

    # 검진 결과지 추출 · 가져오기 (#537) — 쪽 이미지 multipart (브라우저가 1MB 아래로 맞추지만 서버 상한 8MB 와 맞춘다) ·
    # 가져오기 JSON (추출 원문 포함). 기본 client_max_body_size 1MB 면 앱에 닿기 전에 413.
    # 추출은 Claude CLI 50초 타임아웃 — 기본 proxy_read_timeout 60s 보다 여유를 둔다.
    # ⚠️ 끝에 `/` 를 붙이지 않는다 (#540): `/` 로 끝나는 prefix + proxy_pass 는 `/api/checkups` (목록 GET · 폼 POST) 를
    # `/api/checkups/` 로 301 하고, Next.js 가 다시 슬래시를 떼는 308 → 리다이렉트 루프. POST 는 301 에서 GET 으로 바뀐다.
    location /api/checkups {
        client_max_body_size 10m;
        proxy_pass http://localhost:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # 리버스 프록시
    location / {
        proxy_pass http://localhost:4200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
