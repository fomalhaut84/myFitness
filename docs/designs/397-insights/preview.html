<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>분석 — /insights 시안 (#397)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0a0a0a; --card:#161616; --surface:#1e1e1e; --border:#262626; --border-hover:#333; --dim:#525252; --sub:#737373; --text:#a3a3a3; --bright:#ededed;
    --hr:#f87171; --temp:#fbbf24; --mono:"Geist Mono",ui-monospace,monospace; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font:14px/1.5 "Geist",system-ui,sans-serif; }
  a { color:inherit; text-decoration:none; } button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
  :focus-visible { outline:2px solid var(--bright); outline-offset:2px; border-radius:4px; }
  .page { max-width:1040px; margin:0 auto; padding:24px 16px 80px; }
  .proto-note { font-size:12px; color:var(--dim); margin-bottom:20px; } .proto-note a { color:var(--sub); text-decoration:underline; }
  h1 { font-size:26px; font-weight:600; color:var(--bright); letter-spacing:-0.02em; }
  .lede { color:var(--sub); font-size:13px; margin:6px 0 22px; max-width:640px; }

  /* 패널 = 질문. 제목이 곧 질문이고, 답은 판독값 띠의 숫자 하나 */
  .panel { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px 18px 14px; margin-bottom:14px; }
  .panel h2 { font-size:17px; font-weight:600; color:var(--bright); letter-spacing:-0.01em; }
  .panel .how { font-size:12px; color:var(--sub); margin:3px 0 12px; }
  svg { display:block; width:100%; height:auto; overflow:visible; }
  svg text { font:10px var(--mono); fill:var(--dim); }
  .grid-line { stroke:#1f1f1f; }
  .axis-title { fill:var(--sub); font-size:10px; }

  .legend { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; align-items:center; }
  .legend button { display:flex; align-items:center; gap:6px; font:500 12px var(--mono); padding:4px 9px; border:1px solid var(--border); border-radius:999px; color:var(--text); }
  .legend button i { width:8px; height:8px; border-radius:50%; background:var(--c); } .legend button.off { opacity:.35; }
  .legend .k { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--sub); margin-left:6px; } .legend .k i { width:8px; height:8px; border-radius:50%; background:var(--c); }
  .legend .k.hollow i { background:transparent; border:1.5px solid var(--sub); }

  /* 판독값 = 답. 숫자 하나가 크고, 근거 표가 옆에 */
  .answer { display:grid; grid-template-columns:200px 1fr; gap:14px; margin-top:14px; }
  .big { border:1px solid var(--border); border-radius:12px; padding:12px 14px; background:var(--bg); }
  .big dt { font-size:11px; color:var(--sub); } .big dd { font:500 26px/1.2 var(--mono); color:var(--bright); margin-top:4px; letter-spacing:-0.02em; }
  .big dd small { font:400 12px var(--mono); color:var(--sub); margin-left:4px; } .big dd span { display:block; font:400 11px "Geist",sans-serif; color:var(--sub); margin-top:4px; }
  .big dd.na { font:400 13px "Geist",sans-serif; color:var(--dim); }
  table { width:100%; border-collapse:collapse; } th, td { padding:6px 10px; text-align:right; border-top:1px solid var(--border); white-space:nowrap; font-size:12px; }
  thead th { border-top:0; font-weight:500; color:var(--sub); } th:first-child, td:first-child { text-align:left; }
  tbody th { font-weight:400; color:var(--text); font-family:var(--mono); } td { font:500 13px var(--mono); color:var(--bright); } td small { font:400 11px var(--mono); color:var(--dim); margin-left:4px; } td.na { color:var(--dim); font-weight:400; }
  .tablewrap { border:1px solid var(--border); border-radius:12px; overflow-x:auto; background:var(--bg); }
  .foot { font-size:11px; color:var(--dim); margin-top:8px; }

  .trio { display:grid; grid-template-columns:repeat(3,1fr); border:1px solid var(--border); border-radius:12px; background:var(--bg); }
  .trio div { padding:10px 14px; border-left:1px solid var(--border); } .trio div:first-child { border-left:0; }
  .trio dt { font-size:11px; color:var(--sub); } .trio dd { font:500 20px var(--mono); color:var(--bright); } .trio dd small { font:400 11px var(--mono); color:var(--sub); margin-left:3px; } .trio dd span { display:block; font:400 11px "Geist",sans-serif; color:var(--sub); }

  @media (max-width:560px) { h1 { font-size:22px; } .panel { padding:14px 10px 10px; } .panel h2 { font-size:15px; } .answer { grid-template-columns:1fr; } .trio { grid-template-columns:1fr; } .trio div { border-left:0; border-top:1px solid var(--border); } .trio div:first-child { border-top:0; } }
</style>
</head>
<body>
<div class="page">
  <p class="proto-note">시안 #397 — 데이터는 가짜(시드 난수 · 연도별 경향을 심어 둠). 하한 2020-06-16 · 오늘 2026-09-21 고정. 범례 버튼은 연도 토글.</p>
  <h1>분석</h1>
  <p class="lede">지표 하나의 추이가 아니라 <b style="color:var(--text);font-weight:500">두 값의 관계</b>를 봅니다. 러닝 2,156건 · 6년치. 각 패널의 제목이 질문이고, 오른쪽 숫자가 답입니다.</p>
  <div id="app"></div>
</div>
<script>
const TODAY="2026-09-21", CUR=2026, YEARS=[2020,2021,2022,2023,2024,2025,2026];
const pad=n=>String(n).padStart(2,"0");
function rnd(k){let h=2166136261;for(const c of k){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}h^=h>>>13;h=Math.imul(h,0x5bd1e995);return((h^(h>>>15))>>>0)/4294967296;}
const gauss=k=>(rnd(k+"a")+rnd(k+"b")+rnd(k+"c")-1.5)*2;
const pace=s=>{const t=Math.round(s);return `${Math.floor(t/60)}'${pad(t%60)}"`;};
const GRAYS=["#3a3a3a","#4a4a4a","#5c5c5c","#737373","#8f8f8f","#b0b0b0"];
const yc=(y,c)=>y===CUR?c:GRAYS[y-2020];
const median=a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);const m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2;};

/* ---- 가짜 러닝 2,100건: 해마다 페이스 ↑ 심박 ↓, 여름 느림 ---- */
const RUNS=[];
YEARS.forEach(y=>{ const n=y===2020?190:y===2026?250:340; for(let i=0;i<n;i++){ const k=`${y}-${i}`; const mo=y===2020?6+Math.floor(rnd(k+"m")*7):y===2026?1+Math.floor(rnd(k+"m")*9):1+Math.floor(rnd(k+"m")*12);
  const temp=Math.round(16+13*Math.cos((mo-7.5)/12*2*Math.PI)+gauss(k+"t")*3.5); const hum=Math.round(65+18*Math.cos((mo-7.5)/12*2*Math.PI)+gauss(k+"h")*10);
  const peak=(y===2023&&mo>=10)||(y===2024&&mo<=4)?1:0; const fit=(y-2020)*7+peak*10; // 초/km 개선
  const basePace=345-fit+Math.max(0,temp-20)*1.6+gauss(k+"p")*22; const hr=Math.round(196-(basePace-300)*0.22-(y-2020)*1.6-peak*3+gauss(k+"r")*4);
  const dist=3000+rnd(k+"d")*rnd(k+"d2")*18000; const race=rnd(k+"race")<0.008;
  const zones=y>=2025||(y===2024&&mo>=12)?(()=>{const e=0.55+(y-2024)*0.06+gauss(k+"z")*0.06;const z=[0.08,e-0.08,0.2,0.1-(y-2024)*0.02,0.04];const s=z.reduce((a,b)=>a+b);return z.map(v=>Math.max(0,v/s));})():null;
  RUNS.push({y,mo,ymd:`${y}-${pad(mo)}-${pad(1+Math.floor(rnd(k+"dd")*28))}`,pace:basePace,hr,temp,hum,dist,race,zones}); }});
const hidden={A:new Set(),D:new Set()};

/* ---- 공용 SVG 산점도 ---- */
function frame(W,H,xs,ys,opt){ const L=44,R=10,T=12,B=30; const xr=[Math.min(...xs),Math.max(...xs)], yr=[Math.min(...ys),Math.max(...ys)];
  const px=(xr[1]-xr[0])*0.04, py=(yr[1]-yr[0])*0.06; const xd=[xr[0]-px,xr[1]+px], yd=[yr[0]-py,yr[1]+py];
  const x=v=>opt.xRev?L+(W-L-R)*(1-(v-xd[0])/(xd[1]-xd[0])):L+(W-L-R)*(v-xd[0])/(xd[1]-xd[0]);
  const y=v=>opt.yRev?T+(H-T-B)*((v-yd[0])/(yd[1]-yd[0])):T+(H-T-B)*(1-(v-yd[0])/(yd[1]-yd[0]));
  const ticks=(d,n)=>Array.from({length:n},(_,i)=>d[0]+(d[1]-d[0])*i/(n-1));
  let g=""; ticks(yd,5).forEach(t=>{g+=`<line class="grid-line" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-6}" y="${y(t)+3}" text-anchor="end">${opt.yf(t)}</text>`;});
  ticks(xd,7).forEach(t=>{g+=`<text x="${x(t)}" y="${H-12}" text-anchor="middle">${opt.xf(t)}</text>`;});
  g+=`<text class="axis-title" x="${W-R}" y="${H-1}" text-anchor="end">${opt.xt}</text><text class="axis-title" x="${L}" y="${T-3}">${opt.yt}</text>`;
  return {x,y,grid:g}; }
function scatter(id,pts,opt){ const W=1000,H=320; const f=frame(W,H,pts.map(p=>p.x),pts.map(p=>p.y),opt); let body="";
  for(const p of pts){ if(p.hide) continue; body+=p.hollow?`<circle cx="${f.x(p.x)}" cy="${f.y(p.y)}" r="3.2" fill="#161616" stroke="${p.c}" stroke-width="1.4"><title>${p.t}</title></circle>`
      :`<circle cx="${f.x(p.x)}" cy="${f.y(p.y)}" r="${p.r||2.2}" fill="${p.c}" fill-opacity="${p.o||0.7}"><title>${p.t}</title></circle>`; }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${opt.label}">${f.grid}${body}</svg>`; }
function yearLegend(key,color,extra=""){ return `<div class="legend" role="group" aria-label="연도 표시">${YEARS.map(y=>`<button class="${hidden[key].has(y)?"off":""}" style="--c:${yc(y,color)}" aria-pressed="${!hidden[key].has(y)}" onclick="hidden.${key}.has(${y})?hidden.${key}.delete(${y}):hidden.${key}.add(${y});render()"><i></i>${y}</button>`).join("")}${extra}</div>`; }

/* ---- A 효율 ---- */
function panelA(){ const band=[300,330]; const pts=RUNS.filter(r=>r.hr).map(r=>({x:r.pace,y:r.hr,c:yc(r.y,"var(--hr)"),hollow:r.race,hide:hidden.A.has(r.y),t:`${r.ymd} · ${pace(r.pace)}/km · ${r.hr}bpm · ${(r.dist/1000).toFixed(1)}km${r.race?" · 레이스":""}`}));
  const rows=YEARS.map(y=>{const v=RUNS.filter(r=>r.y===y&&r.pace>=band[0]&&r.pace<band[1]&&r.hr).map(r=>r.hr);return {y,n:v.length,hr:v.length>=5?Math.round(v.reduce((a,b)=>a+b)/v.length):null};});
  const first=rows.find(r=>r.hr!==null), last=rows[rows.length-1];
  return `<section class="panel"><h2>같은 페이스, 더 낮은 심박?</h2><p class="how">점 = 러닝 1건 (3km 이상). 가로 = 평균 페이스 (오른쪽이 빠름), 세로 = 평균 심박. 올해만 색, 지난 해는 최근일수록 밝은 회색. 속 빈 점 = 레이스</p>
   ${scatter("A",pts,{xRev:true,yRev:false,xf:v=>pace(v),yf:v=>Math.round(v),xt:"페이스 /km →빠름",yt:"bpm",label:"페이스 대비 평균 심박 산점도"})}
   ${yearLegend("A","var(--hr)",`<span class="k hollow"><i></i>레이스</span>`)}
   <div class="answer"><dl class="big"><dt>${pace(band[0])}~${pace(band[1])} 구간 · 올해 vs ${first.y}</dt><dd>${last.hr!==null&&first.hr!==null?`${last.hr-first.hr>0?"+":"−"}${Math.abs(last.hr-first.hr)}<small>bpm</small>`:"—"}<span>${first.hr} → ${last.hr} bpm · 같은 페이스로 달릴 때</span></dd></dl>
   <div class="tablewrap"><table><thead><tr><th>해</th>${rows.map(r=>`<th>${r.y}</th>`).join("")}</tr></thead><tbody><tr><th scope="row">평균 심박</th>${rows.map(r=>r.hr===null?`<td class="na">—</td>`:`<td>${r.hr}<small>n=${r.n}</small></td>`).join("")}</tr></tbody></table></div></div>
   <p class="foot">기준 구간은 6년 평균 페이스 근처의 30초 폭. 5건 미만인 해는 — · 페이스가 느린 러닝 (회복 · 장거리) 은 같은 페이스로만 비교되므로 표에 섞이지 않습니다.</p></section>`; }

/* ---- B 기온 ---- */
const HUM=["#7a5a12","#c9961d","#fbbf24"], HUML=["50% 미만","50~75%","75% 초과"];
function panelB(){ const pts=RUNS.map(r=>({x:r.temp,y:r.pace,c:HUM[r.hum<50?0:r.hum<=75?1:2],o:0.75,t:`${r.ymd} · ${r.temp}°C · 습도 ${r.hum}% · ${pace(r.pace)}/km`}));
  const bins=[[-99,5],[5,10],[10,15],[15,20],[20,25],[25,30],[30,99]]; const rows=bins.map(([a,b])=>{const v=RUNS.filter(r=>r.temp>=a&&r.temp<b).map(r=>r.pace);return {a,b,n:v.length,m:v.length>=5?median(v):null};});
  const hot=rows[6], mild=rows[2];
  return `<section class="panel"><h2>여름이 페이스를 얼마나 깎나?</h2><p class="how">가로 = 러닝 당시 기온 (외부 기상 · 손목 온도 아님), 세로 = 평균 페이스 (위가 빠름). 점 색 = 습도 3단</p>
   ${scatter("B",pts,{xRev:false,yRev:true,xf:v=>`${Math.round(v)}°`,yf:v=>pace(v),xt:"기온 °C",yt:"페이스 /km ↑빠름",label:"기온 대비 페이스 산점도"})}
   <div class="legend">${HUM.map((c,i)=>`<span class="k" style="--c:${c};margin-left:0"><i></i>습도 ${HUML[i]}</span>`).join("")}</div>
   <div class="answer"><dl class="big"><dt>30°C 이상 vs 10~15°C</dt><dd>${hot.m&&mild.m?`+${Math.round(hot.m-mild.m)}<small>초/km</small>`:"—"}<span>중앙값 ${pace(mild.m)} → ${pace(hot.m)}</span></dd></dl>
   <div class="tablewrap"><table><thead><tr><th>기온</th>${rows.map(r=>`<th>${r.a<-50?"< 5":r.b>50?"≥ 30":`${r.a}~${r.b}`}</th>`).join("")}</tr></thead><tbody><tr><th scope="row">중앙값 페이스</th>${rows.map(r=>r.m===null?`<td class="na">—</td>`:`<td>${pace(r.m)}<small>n=${r.n}</small></td>`).join("")}</tr></tbody></table></div></div>
   <p class="foot">평균이 아니라 중앙값 — 레이스 · 회복 러닝 같은 극단값에 덜 흔들립니다. 5건 미만 구간은 —.</p></section>`; }

/* ---- C 존 스택 ---- */
const ZC=["#a3a3a3","#22c55e","#60a5fa","#f59e0b","#ef4444"], ZN=["회복","이지","에어로빅","역치","VO2max"];
function panelC(){ const months=[]; for(let y=2024;y<=2026;y++) for(let m=1;m<=12;m++){ const key=`${y}-${pad(m)}`; if(key<"2024-06"||key>"2026-09") continue; const all=RUNS.filter(r=>r.y===y&&r.mo===m); const wz=all.filter(r=>r.zones);
    const share=wz.length?[0,1,2,3,4].map(i=>wz.reduce((a,r)=>a+r.zones[i]*r.dist/1000*r.pace/60,0)):null; const tot=share?share.reduce((a,b)=>a+b):0;
    months.push({key,all:all.length,wz:wz.length,low:all.length>0&&wz.length/all.length<0.5,share:share&&tot?share.map(v=>v/tot):null,partial:key==="2026-09"}); }
  const W=1000,H=280,L=44,R=10,T=12,B=30,step=(W-L-R)/months.length; let body="";
  [0,25,50,75,100].forEach(t=>{const yy=T+(H-T-B)*(1-t/100);body+=`<line class="grid-line" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text x="${L-6}" y="${yy+3}" text-anchor="end">${t}%</text>`;});
  months.forEach((m,i)=>{ const x0=L+step*i+step*0.14, w=step*0.72; if(!m.share){ body+=`<rect x="${x0}" y="${T}" width="${w}" height="${H-T-B}" fill="none" stroke="#1f1f1f" stroke-dasharray="2 3"/>`; }
    else { let acc=0; m.share.forEach((v,z)=>{ const h=(H-T-B)*v, yy=T+(H-T-B)*(1-acc-v); body+=`<rect x="${x0}" y="${yy}" width="${w}" height="${h}" fill="${ZC[z]}" opacity="${m.low?0.28:0.85}"${m.partial?` stroke="${ZC[z]}" stroke-dasharray="3 2" fill-opacity="0.35"`:""}><title>${m.key} · ${ZN[z]} ${Math.round(v*100)}% · 존 있는 러닝 ${m.wz}/${m.all}</title></rect>`; acc+=v; }); }
    if(m.key.endsWith("-01")||i===0) body+=`<text x="${x0+w/2}" y="${H-12}" text-anchor="middle" style="fill:#a3a3a3">${m.key.slice(0,4)}</text>`; else if(i%3===0) body+=`<text x="${x0+w/2}" y="${H-12}" text-anchor="middle">${+m.key.slice(5)}월</text>`; });
  const rec=months.filter(m=>m.share&&!m.low&&m.key>="2025-09"), prev=months.filter(m=>m.share&&!m.low&&m.key>="2024-09"&&m.key<"2025-09");
  const easy=ms=>ms.length?ms.reduce((a,m)=>a+m.share[0]+m.share[1],0)/ms.length:null, hard=ms=>ms.length?ms.reduce((a,m)=>a+m.share[3]+m.share[4],0)/ms.length:null;
  const pc=v=>v===null?"—":`${Math.round(v*100)}%`;
  return `<section class="panel"><h2>강도 배분이 달라졌나?</h2><p class="how">달마다 심박 존 1~5 에 머문 시간의 비율. 존 분포는 2024-12 부터 있습니다 (그 앞은 빈 칸)</p>
   <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="월별 심박 존 비율">${body}</svg>
   <div class="legend">${ZC.map((c,i)=>`<span class="k" style="--c:${c};margin-left:0"><i style="border-radius:2px"></i>존 ${i+1} ${ZN[i]}</span>`).join("")}<span class="k" style="margin-left:6px"><svg viewBox="0 0 14 12" style="width:14px;height:12px"><rect x="3" y="1" width="8" height="10" fill="#22c55e" opacity=".28"/></svg>존 있는 러닝이 절반 미만인 달</span><span class="k">점선 = 아직 끝나지 않은 달</span></div>
   <dl class="trio" style="margin-top:14px"><div><dt>이지 비율 (존 1~2) · 최근 12개월</dt><dd>${pc(easy(rec))}<span>${rec.length}개 달</span></dd></div><div><dt>그 전 12개월</dt><dd>${pc(easy(prev))}<span>${prev.length}개 달</span></dd></div><div><dt>고강도 (존 4~5) 최근 · 이전</dt><dd>${pc(hard(rec))}<small>· ${pc(hard(prev))}</small><span>존 4~5 시간 비율</span></dd></div></dl></section>`; }

/* ---- D 지연 상관 ---- */
function weeks(){ const out=[]; let d=new Date("2020-06-15T00:00:00Z"); const end=new Date("2026-09-14T00:00:00Z"); let i=0;
  while(d<=end){ const k=d.toISOString().slice(0,10), y=+k.slice(0,4), mo=+k.slice(5,7); const peak=(y===2023&&mo>=10)||(y===2024&&mo<=4)?1:0;
    const km=Math.max(0,28+peak*14+(y-2020)*1.5+gauss("w"+k)*11); const rhr=Math.round(52-(y-2020)*0.4-peak*2.5+gauss("r"+k)*1.6); out.push({k,y,km,rhr,i:i++}); d=new Date(d.getTime()+7*864e5); }
  // 지연 효과 심기: 다음 주 rhr += (km-30)*0.045
  for(let j=1;j<out.length;j++) out[j].rhr=Math.round(out[j].rhr+(out[j-1].km-30)*0.045); return out; }
const WEEKS=weeks();
function pearson(p){ const n=p.length; if(n<3) return null; const mx=p.reduce((a,q)=>a+q.x,0)/n, my=p.reduce((a,q)=>a+q.y,0)/n; let sxy=0,sxx=0,syy=0; for(const q of p){sxy+=(q.x-mx)*(q.y-my);sxx+=(q.x-mx)**2;syy+=(q.y-my)**2;} return sxx&&syy?sxy/Math.sqrt(sxx*syy):null; }
function panelD(){ const pairs=lag=>WEEKS.slice(0,WEEKS.length-lag).map((w,i)=>({x:w.km,y:WEEKS[i+lag].rhr,y0:w.y,k:w.k}));
  const p1=pairs(1); const pts=p1.map(p=>({x:p.x,y:p.y,c:yc(p.y0,"var(--hr)"),hide:hidden.D.has(p.y0),t:`${p.k} 주 ${p.x.toFixed(1)}km → 다음 주 RHR ${p.y}bpm`}));
  const rs=[0,1,2].map(l=>({l,r:pearson(pairs(l)),n:pairs(l).length}));
  const qs=[[0,20],[20,35],[35,50],[50,999]]; const qt=qs.map(([a,b])=>{const v=p1.filter(p=>p.x>=a&&p.x<b).map(p=>p.y);return {a,b,n:v.length,m:v.length?v.reduce((x,y)=>x+y)/v.length:null};});
  const word=r=>r===null?"—":Math.abs(r)<0.1?"관계 없음":Math.abs(r)<0.3?"약한 관계":"관계 있음";
  return `<section class="panel"><h2>많이 뛴 다음 주, 안정시 심박이 오르나?</h2><p class="how">점 = 한 주. 가로 = 그 주 러닝 거리, 세로 = <b style="color:var(--text)">다음 주</b> 평균 안정시 심박. 끝나지 않은 주 · 기록이 절반 미만인 주는 뺐습니다</p>
   ${scatter("D",pts,{xRev:false,yRev:false,xf:v=>`${Math.round(v)}`,yf:v=>Math.round(v),xt:"주간 km",yt:"다음 주 RHR bpm",label:"주간 거리 대비 다음 주 안정시 심박"})}
   ${yearLegend("D","var(--hr)")}
   <dl class="trio" style="margin-top:14px">${rs.map(x=>`<div><dt>상관 r · ${x.l===0?"같은 주":`${x.l}주 뒤`}</dt><dd>${x.r===null?"—":(x.r>=0?"+":"−")+Math.abs(x.r).toFixed(2)}<span>${word(x.r)} · n=${x.n}</span></dd></div>`).join("")}</dl>
   <div class="answer" style="grid-template-columns:1fr"><div class="tablewrap"><table><thead><tr><th>주간 km</th>${qt.map(q=>`<th>${q.b>500?`${q.a}+`:`${q.a}~${q.b}`}</th>`).join("")}</tr></thead><tbody><tr><th scope="row">다음 주 평균 RHR</th>${qt.map(q=>q.m===null?`<td class="na">—</td>`:`<td>${q.m.toFixed(1)}<small>n=${q.n}</small></td>`).join("")}</tr></tbody></table></div></div>
   <p class="foot">r 은 피어슨 상관계수. 통계 검정이 아니라 방향과 크기의 감각입니다 — 0.1 미만은 관계 없음, 0.3 이상이면 관계 있음으로 읽습니다.</p></section>`; }

function render(){ document.getElementById("app").innerHTML=panelA()+panelB()+panelC()+panelD(); }
addEventListener("resize",render); render();
</script>
</body>
</html>
