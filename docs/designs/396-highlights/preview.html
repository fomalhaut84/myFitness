<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하이라이트 — /trends · /history 시안 (#396)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0a0a0a; --bg-raised:#111; --card:#161616; --card-hover:#1c1c1c; --surface:#1e1e1e; --border:#262626; --border-hover:#333;
    --dim:#525252; --sub:#737373; --text:#a3a3a3; --bright:#ededed; --m:#22c55e; --mono:"Geist Mono",ui-monospace,monospace;
    /* #396 마커 — 무채색 3단. 지표 색은 데이터에만 쓴다 */
    --mk-race:#e5e5e5; --mk-metric:#737373; --mk-plan:rgba(255,255,255,.06); }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font:14px/1.5 "Geist",system-ui,sans-serif; }
  a { color:inherit; text-decoration:none; } button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
  :focus-visible { outline:2px solid var(--m); outline-offset:2px; border-radius:4px; }
  .page { max-width:1040px; margin:0 auto; padding:24px 16px 80px; }

  h1 { font-size:26px; font-weight:600; color:var(--bright); letter-spacing:-0.02em; }

  .views { display:flex; gap:22px; border-bottom:1px solid var(--border); margin:14px 0 18px; overflow-x:auto; scrollbar-width:none; }
  .views a { padding:8px 0 10px; font-size:14px; color:var(--sub); white-space:nowrap; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .views a:hover { color:var(--bright); } .views a.on { color:var(--bright); border-color:var(--m); }
  .views a small { display:block; font-size:11px; color:var(--dim); font-weight:400; }
  .metrics { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; margin-bottom:14px; }

  .metrics a:hover { border-color:var(--border-hover); }
  .metrics a.on { color:var(--bright); border-color:var(--c); background:color-mix(in srgb,var(--c) 10%,transparent); } .metrics a.on i { opacity:1; }
  .metrics .gap { width:1px; background:var(--border); margin:4px; flex:none; }
  .seg-row { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px; align-items:center; }
  .seg { display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .seg a { padding:5px 12px; font-size:13px; color:var(--sub); border-left:1px solid var(--border); } .seg a:first-child { border-left:0; }
  .seg a:hover { color:var(--bright); } .seg a.on { background:var(--surface); color:var(--bright); }
  /* 마커 토글 — 지표 pill 과 같은 형태지만 색 점 대신 마커 글리프. 켜짐 = 밝은 테두리 (지표색 아님: 마커는 무채색) */
  .toggle { display:flex; align-items:center; gap:7px; font-size:13px; padding:5px 12px; border:1px solid var(--border); border-radius:999px; color:var(--sub); margin-left:auto; }
  .toggle.on { color:var(--bright); border-color:var(--border-hover); background:var(--surface); }

  .panel { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px 18px 12px; }

  svg { display:block; width:100%; height:auto; overflow:visible; }
  svg text { font:10px var(--mono); fill:var(--dim); }
  .grid-line { stroke:#1f1f1f; } .year-line { stroke:#2a2a2a; stroke-dasharray:2 3; }
  svg a { cursor:pointer; } svg a:hover rect, svg a:hover circle { filter:brightness(1.25); }
  .mk-label { font:500 9px var(--mono); fill:var(--mk-race); }

  .summary { display:grid; grid-template-columns:repeat(3,1fr); margin-top:14px; border:1px solid var(--border); border-radius:12px; background:var(--card); }
  .summary div { padding:12px 14px; border-left:1px solid var(--border); min-width:0; } .summary div:first-child { border-left:0; }
  .summary dt { font-size:11px; color:var(--sub); } .summary dd { font:500 17px var(--mono); color:var(--bright); white-space:nowrap; }
  .summary dd small { font:400 11px var(--mono); color:var(--sub); margin-left:3px; } .summary dd span { display:block; font:400 11px "Geist",sans-serif; color:var(--sub); }
  .summary dd a { text-decoration:underline; text-decoration-color:var(--border-hover); text-underline-offset:3px; } .summary dd a:hover { color:var(--bright); }
  .keys { display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--sub); margin-top:10px; }

  /* 이 기간의 이벤트 — 차트의 접근 가능한 대응물. 종류 배지는 글리프 + 글자, 색 없음 */
  .events { margin-top:14px; border:1px solid var(--border); border-radius:12px; background:var(--card); }
  .events h3 { font-size:12px; font-weight:500; color:var(--sub); padding:10px 14px 0; }
  .events ol { list-style:none; padding:6px 0 4px; }
  .events li { display:grid; grid-template-columns:92px 84px 1fr auto; gap:10px; align-items:baseline; padding:7px 14px; border-top:1px solid #1c1c1c; }
  .events li:first-child { border-top:0; }
  .events time { font:13px var(--mono); color:var(--text); }
  .events .kind { display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--sub); }
  .events .kind svg { width:12px; height:12px; flex:none; }
  .events .what { color:var(--bright); min-width:0; } .events .what small { color:var(--sub); font:12px var(--mono); margin-left:6px; }
  .events .go { font-size:12px; color:var(--sub); white-space:nowrap; } .events .go:hover { color:var(--bright); }
  .events .more { padding:8px 14px 10px; font-size:12px; color:var(--dim); border-top:1px solid #1c1c1c; }

  /* 개인 기록 — 하루의 장부 (#394 일 뷰) 와 같은 형태. 왼쪽 제목 132px · 값 mono · 오른쪽 날짜가 링크 */
  .ledger { border:1px solid var(--border); border-radius:12px; background:var(--card); }
  .ledger .row { display:grid; grid-template-columns:132px 1fr auto; gap:14px; align-items:baseline; padding:13px 16px; border-top:1px solid var(--border); }
  .ledger .row:first-child { border-top:0; }
  .ledger .row.none { background:#121212; padding:10px 16px; }
  .ledger .k { font-size:13px; color:var(--text); } .ledger .row.none .k { color:var(--sub); }
  .ledger .v { font:500 17px var(--mono); color:var(--bright); white-space:nowrap; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .ledger .v small { font:400 12px var(--mono); color:var(--sub); margin-left:8px; }
  .ledger .v .badge { display:inline-block; vertical-align:2px; font:500 10px "Geist",sans-serif; color:var(--text); border:1px solid var(--border-hover); border-radius:999px; padding:1px 7px; margin-left:8px; }
  .ledger .row.none .v { font:400 13px "Geist",sans-serif; color:var(--dim); }
  .ledger .d { font:13px var(--mono); color:var(--sub); text-decoration:underline; text-decoration-color:var(--border-hover); text-underline-offset:3px; white-space:nowrap; }
  .ledger .d:hover { color:var(--bright); }
  .ledger .d.plain { text-decoration:none; color:var(--dim); }
  .section-title { font-size:13px; font-weight:500; color:var(--text); margin:22px 0 8px; } .section-title small { color:var(--sub); font-weight:400; margin-left:6px; }

  table { width:100%; border-collapse:collapse; } th, td { padding:10px 14px; text-align:right; border-top:1px solid var(--border); white-space:nowrap; }
  thead th { border-top:0; font-size:12px; font-weight:500; color:var(--sub); } th:first-child, td:first-child { text-align:left; }
  td { font:500 14px var(--mono); color:var(--bright); } td.name { font:14px "Geist",sans-serif; color:var(--text); text-align:left; white-space:normal; min-width:170px; }
  td.name a:hover { color:var(--bright); } td small { font:400 11px var(--mono); color:var(--sub); margin-left:3px; }
  td.date a { color:var(--sub); text-decoration:underline; text-decoration-color:var(--border-hover); text-underline-offset:3px; } td.date a:hover { color:var(--bright); }
  .tablewrap { background:var(--card); border:1px solid var(--border); border-radius:12px; overflow-x:auto; }
  .empty { padding:22px 16px; font-size:13px; color:var(--sub); border:1px dashed var(--border); border-radius:12px; }

  /* /history 연 뷰 발췌 (#394) + 커버리지 띠 */
  .crumbs { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; } .crumbs a { color:var(--sub); } .crumbs .sep { color:var(--dim); }
  .navrow { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:14px 0 20px; flex-wrap:wrap; }
  .years { display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; } .years a { font:500 13px var(--mono); padding:6px 10px; border-radius:8px; color:var(--sub); white-space:nowrap; } .years a.on { background:var(--surface); color:var(--bright); }
  .step { display:flex; gap:6px; } .step a { font-size:13px; padding:6px 10px; border:1px solid var(--border); border-radius:8px; color:var(--text); }
  details.cov { border:1px solid var(--border); border-radius:12px; background:var(--card); margin-bottom:14px; }
  details.cov summary { list-style:none; cursor:pointer; display:flex; align-items:baseline; gap:12px; padding:9px 14px; font-size:12px; color:var(--sub); flex-wrap:wrap; }
  details.cov summary::-webkit-details-marker { display:none; }
  details.cov summary b { font:500 13px var(--mono); color:var(--text); }
  details.cov summary .counts { display:flex; gap:12px; flex-wrap:wrap; } details.cov summary .counts span { font:12px var(--mono); }
  details.cov summary .chev { margin-left:auto; color:var(--dim); font-size:11px; } details[open].cov .chev::before { content:"접기"; } details.cov:not([open]) .chev::before { content:"자세히"; }
  .covgrid { padding:6px 14px 12px; border-top:1px solid var(--border); }
  .covrow { display:grid; grid-template-columns:96px 1fr 196px; gap:12px; align-items:center; padding:5px 0; }
  .covrow .n { font-size:12px; color:var(--text); } .covrow .n small { color:var(--dim); margin-left:4px; }
  .covrow .bar { position:relative; height:6px; background:#1c1c1c; border-radius:3px; }
  .covrow .bar i { position:absolute; top:0; bottom:0; background:#8f8f8f; border-radius:3px; }
  .covrow .c { font:12px var(--mono); color:var(--sub); text-align:right; white-space:nowrap; }
  .covaxis { display:flex; justify-content:space-between; font:10px var(--mono); color:var(--dim); padding:4px 0 0 108px; }
  .kpis { display:grid; grid-template-columns:repeat(7,1fr); border:1px solid var(--border); border-radius:12px; background:var(--card); margin-bottom:24px; }
  .kpis div { padding:12px 14px; border-left:1px solid var(--border); min-width:0; } .kpis div:first-child { border-left:0; }
  .kpis dt { font-size:11px; color:var(--sub); white-space:nowrap; } .kpis dd { font:500 17px var(--mono); color:var(--bright); margin-top:2px; white-space:nowrap; } .kpis dd small { font-size:11px; color:var(--sub); font-weight:400; margin-left:3px; }
  .stub { border:1px dashed var(--border); border-radius:12px; padding:26px; text-align:center; color:var(--dim); font-size:12px; }

  @media (max-width:560px) { h1 { font-size:22px; } .panel { padding:14px 10px 10px; } .summary { grid-template-columns:1fr; } .summary div { border-left:0; border-top:1px solid var(--border); } .summary div:first-child { border-top:0; }
    .events li { grid-template-columns:78px 1fr; } .events .kind { grid-column:2; } .events .what { grid-column:1 / -1; } .events .go { grid-column:1 / -1; justify-self:start; }
    .ledger .row { grid-template-columns:1fr auto; } .ledger .k { grid-column:1 / -1; font-size:12px; color:var(--sub); } .ledger .v { font-size:16px; white-space:normal; overflow:visible; line-height:1.6; }
    th, td { padding:9px 8px; } td { font-size:13px; } .covrow { grid-template-columns:80px 1fr; } .covrow .c { grid-column:2; text-align:left; padding-top:0; } .covaxis { padding-left:92px; }
    .kpis { display:flex; overflow-x:auto; scrollbar-width:none; } .kpis div { flex:none; min-width:112px; } .mk-label { display:none; } .toggle { margin-left:0; } }
</style>

<body>
<div class="page">
  <p class="proto-note">시안 #396 — 시계열 데이터는 가짜(시드 난수), 레이스 14건은 실제 목록입니다. 하한 2020-06-16, 오늘 2026-09-21 고정.
    <a href="#view=series">시계열 (마커)</a> · <a href="#view=series&unit=year&range=all">연 단위 (겹침 라벨)</a> · <a href="#view=records">개인 기록</a> · <a href="#page=history">/history 커버리지 띠</a> · <a href="#view=series&marks=0">마커 끔</a></p>
  <div id="app"></div>
</div>
<script>
const TODAY="2026-09-21", LOWER="2020-06-16";
const METRICS=[
 {id:"runningKm",label:"러닝 거리",unit:"km",dec:2,agg:"sum",zero:true,c:"#22c55e",main:1},
 {id:"steps",label:"걸음",unit:"보",dec:0,agg:"sum",c:"#fbbf24",main:1},
 {id:"sleepScore",label:"수면 점수",unit:"점",dec:0,agg:"avg",band:1,c:"#a78bfa",main:1},
 {id:"restingHR",label:"안정시 심박",unit:"bpm",dec:0,agg:"avg",band:1,c:"#f87171",main:1},
 {id:"weight",label:"체중",unit:"kg",dec:1,agg:"avg",band:1,sparse:1,c:"#2dd4bf",main:1},
 {id:"runningCount",label:"러닝 횟수",unit:"회",dec:0,agg:"sum",zero:true,c:"#86efac"},
 {id:"vo2max",label:"VO2max",unit:"",dec:1,agg:"max",c:"#fb923c"},
];
const M=Object.fromEntries(METRICS.map(m=>[m.id,m]));
const pad=n=>String(n).padStart(2,"0");
function rnd(k){let h=2166136261;for(const c of k){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}h^=h>>>13;h=Math.imul(h,0x5bd1e995);return((h^(h>>>15))>>>0)/4294967296;}
const dim=(y,m)=>new Date(Date.UTC(y,m,0)).getUTCDate();
function dayVal(id,s){ if(s<LOWER||s>TODAY) return undefined; const m=M[id];
  const r=k=>rnd(s+id+k), y=+s.slice(0,4), mo=+s.slice(5,7), season=Math.cos((mo-4)/12*2*Math.PI), peak=(y===2023&&mo>=10)||(y===2024&&mo<=4)?1:0;
  switch(id){
    case "runningKm": return r("a")<0.40+peak*0.18 ? 4+r("b")*r("c")*(22+peak*8) : 0;
    case "runningCount": return dayVal("runningKm",s)>0?1:0;
    case "steps": return r("a")<(y===2021&&mo===8?0.7:0.04)?null:Math.round(5000+r("b")*9000+(dayVal("runningKm",s)||0)*1100);
    case "sleepScore": return r("a")<(y===2022&&mo===2?0.75:0.06)?null:62+r("b")*30-(season>0.5?3:0);
    case "restingHR": return r("a")<0.04?null:51-season*2+r("b")*5-peak*3-(y-2020)*0.3;
    case "weight": return r("a")<0.8?null:72.8-season*0.9-peak*1.6-(y-2020)*0.2+r("b")*1.2;
    case "vo2max": return r("a")<0.3?null:45+(y-2020)*0.5+peak*3+season+r("b")*1.5;
  }}
function daysBetween(a,b){const out=[];let d=new Date(a+"T00:00:00Z");const e=new Date(b+"T00:00:00Z");for(;d<=e;d=new Date(d.getTime()+864e5))out.push(d.toISOString().slice(0,10));return out;}
function aggregate(id,days){const m=M[id];const vals=days.map(s=>dayVal(id,s));const inRange=vals.filter(v=>v!==undefined);const nums=inRange.filter(v=>v!==null&&!(m.zero&&v===0));
  const total=inRange.length, covered=nums.length; if(m.zero) return {value:nums.reduce((a,b)=>a+b,0),covered,total};
  if(!nums.length) return {value:null,covered:0,total};
  const v=m.agg==="sum"?nums.reduce((a,b)=>a+b,0):m.agg==="max"?Math.max(...nums):nums.reduce((a,b)=>a+b,0)/nums.length;
  return {value:v,covered,total,min:Math.min(...nums),max:Math.max(...nums),last:nums[nums.length-1]};}
function fmt(id,v){ if(v==null) return null; const m=M[id]; return v.toLocaleString("ko-KR",{minimumFractionDigits:m.dec,maximumFractionDigits:m.dec}); }
function axisFmt(id,v){ return Math.abs(v)>=10000?(v/1000).toFixed(0)+"k":(M[id].dec>1?v.toFixed(0):v.toFixed(M[id].dec?1:0)); }
function buckets(unit,from,to){ const out=[]; const [fy,fm]=[+from.slice(0,4),+from.slice(5,7)];
  if(unit==="year"){ for(let y=fy;y<=+to.slice(0,4);y++) out.push({key:`${y}`,label:`${y}`,start:`${y}-01-01`,end:`${y}-12-31`,yearStart:true}); }
  else if(unit==="month"){ let y=fy,m=fm; while(`${y}-${pad(m)}`<=to.slice(0,7)){ out.push({key:`${y}-${pad(m)}`,label:m===1?`${y}`:`${m}월`,start:`${y}-${pad(m)}-01`,end:`${y}-${pad(m)}-${pad(dim(y,m))}`,yearStart:m===1}); m++; if(m>12){m=1;y++;} } }
  else { let d=new Date(from+"T00:00:00Z"); d=new Date(d.getTime()-((d.getUTCDay()||7)-1)*864e5); let prevY=null;
    while(d.toISOString().slice(0,10)<=to){ const s=d.toISOString().slice(0,10), e=new Date(d.getTime()+6*864e5).toISOString().slice(0,10), y=s.slice(0,4);
      out.push({key:s,label:`${+s.slice(5,7)}/${+s.slice(8,10)}`,start:s,end:e,yearStart:prevY!==null&&y!==prevY}); prevY=y; d=new Date(d.getTime()+7*864e5);} }
  return out; }
function bucketKeyOf(ymd,unit){ if(unit==="year") return ymd.slice(0,4); if(unit==="month") return ymd.slice(0,7); const d=new Date(ymd+"T00:00:00Z"); return new Date(d.getTime()-((d.getUTCDay()||7)-1)*864e5).toISOString().slice(0,10); }
function lowCov(m,a){ return !m.zero&&!m.sparse&&a.total>0&&a.covered/a.total<0.5; }

/* ---- 이벤트 (레이스 = 실제 프로덕션 목록 · 지표 변경 · 플랜은 가짜) ---- */
const RACES=[["2021-03-22","달리기",10.01,"4:58"],["2021-11-28","러닝",10.04,"4:41"],["2022-05-27","트랙 러닝",10.21,"4:47"],["2022-11-06","평화의섬 제주 국제마라톤",21.42,"5:12"],
 ["2023-03-26","2023 제주mbc 국제 평화마라톤",21.18,"5:03"],["2023-10-22","2023 아름다운 제주 국제마라톤",21.10,"4:49"],["2023-11-19","제주감귤국제마라톤",10.01,"4:30"],
 ["2024-03-31","2024 제주mbc 국제평화마라톤",21.30,"4:55"],["2024-10-20","2024 아름다운 제주 국제마라톤",21.06,"4:58"],["2024-11-17","2024 제주감귤국제마라톤",20.98,"5:01"],
 ["2025-01-15","10km 러닝",10.17,"4:52"],["2025-04-27","2025 평화의섬 제주 국제마라톤",20.54,"5:09"],["2025-10-25","2025 아름다운 제주 국제마라톤",21.03,"5:04"],["2025-11-16","2025 제주국제감귤마라톤",10.01,"4:44"]];
const paceSec=p=>{const [m,s]=p.split(":").map(Number);return m*60+s;};
const hms=sec=>{sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${h}:${pad(m)}:${pad(s)}`:`${m}:${pad(s)}`;};
const EVENTS=[
 ...RACES.map(([d,n,km,p])=>({kind:"race",ymd:d,title:n,detail:`${km.toFixed(2)}km · ${p}/km · ${hms(paceSec(p)*km)}`,href:`#page=history&ymd=${d}`})),
 {kind:"metric",ymd:"2021-06-03",title:"maxHR 180 → 175",href:"#settings"},{kind:"metric",ymd:"2023-09-14",title:"LTHR 157 → 160",href:"#settings"},
 {kind:"metric",ymd:"2024-02-02",title:"maxHR 175 → 178",href:"#settings"},{kind:"metric",ymd:"2025-08-21",title:"LTHR 160 → 158",href:"#settings"},
 {kind:"plan",ymd:"2023-09-04",endYmd:"2023-10-15",title:"하프 플랜 6주",detail:"주 4회",href:"#training"},{kind:"plan",ymd:"2025-03-03",endYmd:"2025-04-20",title:"하프 플랜 7주",detail:"주 4회",href:"#training"},
 {kind:"plan",ymd:"2026-08-10",endYmd:"2026-10-04",title:"하프 플랜 8주",detail:"주 4회 · 진행 중",href:"#training"}];
const KIND={race:"레이스",metric:"maxHR · LTHR 변경",plan:"트레이닝 플랜"};
const glyph=k=>k==="race"?`<svg viewBox="0 0 12 12"><line x1="6" y1="1" x2="6" y2="11" stroke="var(--mk-race)" stroke-width="1.5"/></svg>`
  :k==="metric"?`<svg viewBox="0 0 12 12"><line x1="6" y1="1" x2="6" y2="11" stroke="var(--mk-metric)" stroke-width="1.5" stroke-dasharray="2 2"/></svg>`
  :`<svg viewBox="0 0 12 12"><rect x="1" y="1" width="10" height="10" fill="rgba(255,255,255,.12)" stroke="#3a3a3a"/></svg>`;

function route(){ const q=new URLSearchParams(location.hash.slice(1)); const g=(k,ok,d)=>ok.includes(q.get(k))?q.get(k):d;
  return {page:g("page",["trends","history"],"trends"),view:g("view",["series","yoy","season","compare","records"],"series"),metric:M[q.get("metric")]?q.get("metric"):"runningKm",
    unit:g("unit",["week","month","year"],"month"),range:g("range",["1y","3y","all"],"3y"),marks:q.get("marks")!=="0",cov:q.get("cov")==="open",ymd:q.get("ymd")}; }
function href(r,patch){ const n={...r,...patch}, q=new URLSearchParams();
  if(n.view!=="series")q.set("view",n.view); if(n.metric!=="runningKm")q.set("metric",n.metric); if(n.unit!=="month")q.set("unit",n.unit); if(n.range!=="3y")q.set("range",n.range); if(!n.marks)q.set("marks","0"); return "#"+q.toString(); }

function controls(r){
  const tab=(v,t,s)=>`<a class="${r.view===v?"on":""}" href="${href(r,{view:v})}">${t}<small>${s}</small></a>`;
  const pill=x=>`<a class="${x.id===r.metric?"on":""}" style="--c:${x.c}" href="${href(r,{metric:x.id})}"><i></i>${x.label}</a>`;
  const seg=(k,opts)=>`<div class="seg" role="group">${opts.map(([v,t])=>`<a class="${r[k]===v?"on":""}" href="${href(r,{[k]:v})}">${t}</a>`).join("")}</div>`;
  const marks=`<a class="toggle ${r.marks?"on":""}" role="switch" aria-checked="${r.marks}" href="${href(r,{marks:!r.marks})}">${glyph("race")}이벤트 마커</a>`;
  return `<h1>추이</h1><nav class="views">${tab("series","시계열","길게 보기")}${tab("yoy","전년 동기","연도끼리 겹치기")}${tab("season","계절성","몇 월에 어떤가")}${tab("compare","기간 비교","두 구간 나란히")}${tab("records","개인 기록","역대 최고는?")}</nav>
   ${r.view==="records"?"":`<nav class="metrics" aria-label="지표">${METRICS.filter(x=>x.main).map(pill).join("")}<span class="gap"></span>${METRICS.filter(x=>!x.main).map(pill).join("")}</nav>`}
   ${r.view==="series"?`<div class="seg-row">${seg("unit",[["week","주"],["month","월"],["year","연"]])}${r.unit==="year"?"":seg("range",[["1y","1년"],["3y","3년"],["all","전체"]])}${marks}</div>`:""}`; }

function frame(W,H,lo,hi,id){ const L=38,R=8,T=16,B=24; const y=v=>T+(H-T-B)*(1-(v-lo)/((hi-lo)||1)); const ticks=[0,1,2,3].map(i=>lo+(hi-lo)*i/3);
  return {L,R,T,B,y,grid:ticks.map(t=>`<line class="grid-line" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-6}" y="${y(t)+3}" text-anchor="end">${axisFmt(id,t)}</text>`).join("")}; }
function bounds(m,vals,mins,maxs){ const all=[...vals,...(mins||[]),...(maxs||[])].filter(v=>v!=null); if(!all.length) return [0,1]; const hi=Math.max(...all), lo=m.agg==="sum"?0:Math.min(...all); const p=(hi-lo)*0.08||1; return [m.agg==="sum"?0:lo-p,hi+p]; }

function seriesView(r){ const m=M[r.metric]; const from=r.unit==="year"||r.range==="all"?LOWER:(()=>{const y=+TODAY.slice(0,4)-(r.range==="1y"?1:3);const s=`${y}-${TODAY.slice(5,7)}-01`;return s<LOWER?LOWER:s;})();
  const bs=buckets(r.unit,from,TODAY).map(b=>({...b,a:aggregate(r.metric,daysBetween(b.start<LOWER?LOWER:b.start,b.end>TODAY?TODAY:b.end)),partial:b.start<LOWER||b.end>TODAY}));
  const idx=new Map(bs.map((b,i)=>[b.key,i])), unitName={week:"주",month:"월",year:"연"}[r.unit];
  const W=1000,H=300,[lo,hi]=bounds(m,bs.map(b=>b.a.value),m.band?bs.map(b=>b.a.min):null,m.band?bs.map(b=>b.a.max):null), f=frame(W,H,lo,hi,r.metric);
  const step=(W-f.L-f.R)/bs.length, x=i=>f.L+step*(i+0.5);
  const target=b=>r.unit==="year"?`#page=history&y=${b.key}`:`#page=history&ym=${bucketKeyOf(r.unit==="week"?new Date(new Date(b.start+"T00:00:00Z").getTime()+3*864e5).toISOString().slice(0,10):b.start,"month")}`;
  const tip=b=>`${b.key} · ${fmt(r.metric,b.a.value)}${m.unit} · ${b.a.covered}/${b.a.total}일 · 클릭 → ${r.unit==="year"?"연":"월"} 뷰`;
  // 마커: 범위 안 이벤트 → 버킷 키. 같은 버킷은 하나로 합친다
  const inRange=EVENTS.filter(e=>(e.endYmd||e.ymd)>=from&&e.ymd<=TODAY);
  const lines=new Map(); inRange.filter(e=>e.kind!=="plan").forEach(e=>{ const k=bucketKeyOf(e.ymd,r.unit); if(!idx.has(k)) return; (lines.get(k)||lines.set(k,[]).get(k)).push(e); });
  const bands=inRange.filter(e=>e.kind==="plan").map(e=>({e,from:idx.get(bucketKeyOf(e.ymd<from?from:e.ymd,r.unit)),to:idx.get(bucketKeyOf(e.endYmd>TODAY?TODAY:e.endYmd,r.unit))})).filter(b=>b.from!=null&&b.to!=null);
  let body="";
  bs.forEach((b,i)=>{ if(b.yearStart) body+=`<line class="year-line" x1="${x(i)-step/2}" x2="${x(i)-step/2}" y1="${f.T}" y2="${H-f.B}"/>`; });
  if(r.marks&&r.unit!=="year") bands.forEach(b=>{ body+=`<rect x="${x(b.from)-step/2}" y="${f.T}" width="${(b.to-b.from+1)*step}" height="${H-f.T-f.B}" fill="var(--mk-plan)"><title>${b.e.title} · ${b.e.ymd} ~ ${b.e.endYmd}</title></rect>`; });
  if(m.agg==="sum"){ bs.forEach((b,i)=>{ if(b.a.value==null) return; const low=lowCov(m,b.a); const yy=f.y(b.a.value), w=Math.max(1.5,step*0.72);
      body+=`<a href="${target(b)}"><rect x="${x(i)-w/2}" y="${yy}" width="${w}" height="${Math.max(0,H-f.B-yy)}" rx="${Math.min(2,w/3)}" fill="${m.c}" opacity="${low?0.28:b.partial?0.5:0.85}"${b.partial&&!low?` stroke="${m.c}" stroke-dasharray="3 2" fill-opacity="0.35"`:""}><title>${tip(b)}</title></rect></a>`; }); }
  else { if(m.band){ let seg=[]; const flush=()=>{ if(seg.length>1) body+=`<path d="M${seg.map(p=>`${p[0]},${p[1]}`).join("L")}L${seg.slice().reverse().map(p=>`${p[0]},${p[2]}`).join("L")}Z" fill="${m.c}" opacity="0.13"/>`; seg=[]; };
      bs.forEach((b,i)=>{ if(b.a.value==null) flush(); else seg.push([x(i),f.y(b.a.max),f.y(b.a.min)]); }); flush(); }
    let path="",pen=false; bs.forEach((b,i)=>{ if(b.a.value==null){pen=false;return;} path+=`${pen?"L":"M"}${x(i)},${f.y(b.a.value)}`; pen=true; });
    body+=`<path d="${path}" fill="none" stroke="${m.c}" stroke-width="2" stroke-linejoin="round"/>`;
    bs.forEach((b,i)=>{ if(b.a.value==null) return; const low=lowCov(m,b.a); body+=`<a href="${target(b)}"><circle cx="${x(i)}" cy="${f.y(b.a.value)}" r="${low?3.5:bs.length<=40?2.2:1.2}" fill="${low?"#161616":m.c}" stroke="${m.c}" stroke-width="1.5"><title>${tip(b)}</title></circle></a>`; }); }
  // 마커 선 — 데이터 위에 그린다. 레이스 실선(밝음) · 지표 변경 점선(중간). 합친 버킷은 라벨 R+1
  if(r.marks) lines.forEach((evs,k)=>{ const i=idx.get(k), races=evs.filter(e=>e.kind==="race").length, isRace=races>0;
    const label=isRace?`R${evs.length>1?`+${evs.length-1}`:""}`:evs.length>1?`×${evs.length}`:"";
    body+=`<g><line x1="${x(i)}" x2="${x(i)}" y1="${f.T-4}" y2="${H-f.B}" stroke="${isRace?"var(--mk-race)":"var(--mk-metric)"}" stroke-width="${isRace?1.5:1}" ${isRace?"":'stroke-dasharray="3 3"'}/>${label?`<text class="mk-label" x="${x(i)}" y="${f.T-7}" text-anchor="middle"${isRace?"":' style="fill:var(--mk-metric)"'}>${label}</text>`:""}<title>${evs.map(e=>`${e.ymd} ${KIND[e.kind]} · ${e.title}`).join("\n")}</title></g>`; });
  const maxLabels=innerWidth<560?6:14, every=Math.ceil(bs.length/maxLabels), dense=bs.length>maxLabels*2; let labels="";
  bs.forEach((b,i)=>{ const nearYear=bs.slice(Math.max(0,i-Math.floor(every/2)),i+Math.ceil(every/2)+1).some(z=>z.yearStart);
    if(b.yearStart&&r.unit!=="year") labels+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle" style="fill:#a3a3a3">${b.key.slice(0,4)}</text>`;
    else if(r.unit==="year"||(!dense&&i%every===0&&!nearYear)) labels+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${b.label}</text>`; });
  const ok=bs.filter(b=>b.a.value!=null&&!lowCov(m,b.a)&&!(b.partial&&m.agg==="sum")), best=ok.reduce((p,c)=>!p||c.a.value>p.a.value?c:p,null), worst=ok.reduce((p,c)=>!p||c.a.value<p.a.value?c:p,null);
  const whole=aggregate(r.metric,daysBetween(from,TODAY));
  const dd=(t,b)=>`<div><dt>${t}</dt>${b?`<dd>${fmt(r.metric,b.a.value)}<small>${m.unit}</small><span><a href="${target(b)}">${b.key}</a></span></dd>`:`<dd><span>기록 없음</span></dd>`}</div>`;
  const list=inRange.slice().sort((a,b)=>b.ymd.localeCompare(a.ymd)), shown=list.slice(0,30);
  const events=r.marks?`<section class="events"><h3>이 기간의 이벤트 <span style="color:var(--dim)">${list.length}건</span></h3>${list.length?`<ol>${shown.map(e=>`<li><time>${e.ymd}</time><span class="kind">${glyph(e.kind)}${KIND[e.kind]}</span><span class="what">${e.title}${e.detail?`<small>${e.detail}</small>`:""}${e.endYmd?`<small>~ ${e.endYmd}</small>`:""}</span><a class="go" href="${e.href}">${e.kind==="race"?"그 날 보기":e.kind==="plan"?"플랜 보기":"프로필 보기"}</a></li>`).join("")}</ol>${list.length>30?`<p class="more">외 ${list.length-30}건</p>`:""}`:`<p class="more">이 기간에 표시할 이벤트가 없습니다. Garmin 에서 활동을 레이스로 표시하거나, 프로필에서 maxHR · LTHR 을 바꾸면 여기에 남습니다.</p>`}</section>`:"";
  return `<section class="panel"><h2>${m.label} <span style="color:var(--sub);font-weight:400">${unitName} 단위${m.unit?` (${m.unit})`:""}</span></h2>
    <p class="lede">${m.agg==="sum"?"막대 = 기간 합계":m.agg==="max"?"선 = 기간 최고":"선 = 기간 평균"+(m.band?", 띠 = 최저~최고":"")}. 막대나 점을 누르면 그 ${r.unit==="year"?"해":"달"}의 기록으로 갑니다</p>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${m.label} ${unitName} 단위 시계열">${f.grid}${body}${labels}</svg>
    <div class="keys">${r.marks?`<span>${glyph("race")}레이스</span><span>${glyph("metric")}maxHR · LTHR 변경</span>${r.unit==="year"?`<span style="color:var(--dim)">플랜 기간은 연 단위에서 목록에만</span>`:`<span>${glyph("plan")}트레이닝 플랜 기간</span>`}<span style="color:var(--dim)">한 ${unitName}에 여럿이면 R+1 · ×2</span>`:""}${m.zero||m.sparse?"":`<span><svg viewBox="0 0 14 12">${m.agg==="sum"?`<rect x="3" y="1" width="8" height="10" fill="${m.c}" opacity=".28"/>`:`<circle cx="7" cy="6" r="3.5" fill="#161616" stroke="${m.c}" stroke-width="1.5"/>`}</svg>기록이 절반 미만인 ${unitName}</span>`}<span>선이 끊긴 곳 = 기록 없음</span></div></section>
    <dl class="summary"><div><dt>기간 전체 ${m.agg==="sum"?"합계":m.agg==="max"?"최고":"평균"}</dt><dd>${fmt(r.metric,whole.value)??"—"}<small>${m.unit}</small><span>${from.slice(0,7)} ~ ${TODAY.slice(0,7)}</span></dd></div>${dd(`가장 높은 ${unitName}`,best)}${dd(`가장 낮은 ${unitName}`,worst)}</dl>${events}`; }

function otherView(r){ return `<div class="empty">이 뷰는 #395 시안 그대로입니다 (<code>docs/designs/395-trends/preview.html</code>). #396 에서 달라지는 것은 하나 — 포인트 · 연도별 점을 누르면 <code>/history/YYYY/MM</code> 으로 갑니다.</div>`; }

/* ---- 개인 기록 ---- */
function recordsView(){
  const rows=[
    {k:"5K 최고",v:"22:41",s:"4:32/km · 5.01km",d:"2024-03-09"},
    {k:"10K 최고",v:"47:05",s:"4:41/km · 10.04km",d:"2021-11-28",race:1},
    {k:"하프 최고",v:"1:41:52",s:"4:49/km · 21.10km",d:"2023-10-22",race:1},
    {k:"풀 최고",none:"40km 이상 달린 기록이 없습니다"},
    {k:"최장 거리",v:"30.12<small>km</small>",s:"2:51:10 · 5:41/km",d:"2024-03-17"},
    {k:"최다 km 월",v:"312.4<small>km</small>",s:"24회",d:"2024-03",month:1},
    {k:"최고 VO2max",v:"50.4",s:"처음 도달한 날",d:"2022-07-02"},
    {k:"최저 안정시 심박",v:"43<small>bpm</small>",s:"처음 도달한 날",d:"2024-01-12"},
  ];
  const row=r=>r.none?`<div class="row none"><span class="k">${r.k}</span><span class="v">${r.none}</span><span class="d plain">—</span></div>`
    :`<div class="row"><span class="k">${r.k}</span><span class="v">${r.v}<small>${r.s}</small>${r.race?`<span class="badge">레이스</span>`:""}</span><a class="d" href="#page=history&${r.month?"ym":"ymd"}=${r.d}">${r.d}</a></div>`;
  const races=RACES.slice().reverse();
  return `<h2 class="section-title" style="margin-top:0">개인 기록<small>2020-06-16 부터, 러닝 기준</small></h2><div class="ledger">${rows.map(row).join("")}</div>
   <h2 class="section-title">레이스<small>${races.length}건 · Garmin 에서 레이스로 표시한 활동</small></h2>
   <div class="tablewrap"><table><thead><tr><th>날짜</th><th style="text-align:left">이름</th><th>거리</th><th>페이스</th><th>시간</th></tr></thead><tbody>${races.map(([d,n,km,p])=>`<tr><td class="date"><a href="#page=history&ymd=${d}">${d}</a></td><td class="name"><a href="#page=history&ymd=${d}">${n}</a></td><td>${km.toFixed(2)}<small>km</small></td><td>${p}<small>/km</small></td><td>${hms(paceSec(p)*km)}</td></tr>`).join("")}</tbody></table></div>
   <div class="keys"><span>이름은 Garmin 활동 이름 그대로입니다. 레이스 표시는 워치나 Garmin Connect 에서 바꾸면 다음 싱크에 반영됩니다.</span></div>`; }

/* ---- /history 연 뷰 발췌 + 커버리지 띠 ---- */
function historyPage(r){
  const src=[["활동","2020-06-19","2026-09-21",2332,"건",1957],["일간 요약","2020-06-19","2026-09-21",2286,"일"],["수면","2020-06-20","2026-09-21",2241,"일"],["체중","2020-06-16","2026-09-19",372,"건"],["피트니스 지표","2020-06-26","2026-09-20",2000,"일"],["야간 HRV","2026-04-20","2026-09-21",151,"일"],["혈압","2025-06-14","2026-09-18",212,"건"],["식단","2026-05-02","2026-09-21",118,"일"]];
  const span=daysBetween(LOWER,TODAY).length-1, pct=d=>(daysBetween(LOWER,d).length-1)/span*100;
  const bar=([n,a,b,c,u,run])=>`<div class="covrow"><span class="n">${n}${run?`<small>러닝 ${run.toLocaleString()}</small>`:""}</span><div class="bar" title="${a} ~ ${b}"><i style="left:${pct(a).toFixed(1)}%;right:${(100-pct(b)).toFixed(1)}%"></i></div><span class="c">${a.slice(0,7).replace("-",".")} ~ ${b.slice(0,7).replace("-",".")} · ${c.toLocaleString()}${u}</span></div>`;
  return `<nav class="crumbs"><a href="#page=history">기록</a><span class="sep">›</span><h1>2024년</h1></nav>
   <div class="navrow"><nav class="years">${[2020,2021,2022,2023,2024,2025,2026].map(y=>`<a class="${y===2024?"on":""}" href="#page=history">${y}</a>`).join("")}</nav><div class="step"><a href="#page=history">올해</a></div></div>
   <nav class="metrics" aria-label="지표">${METRICS.filter(x=>x.main).map(x=>`<a class="${x.id==="runningKm"?"on":""}" style="--c:${x.c}" href="#page=history"><i></i>${x.label}</a>`).join("")}</nav>
   <details class="cov" ${r.cov?"open":""}><summary><b>2020.06 ~ 2026.09</b><span class="counts">${src.map(([n,,,c,u])=>`<span>${n} ${c.toLocaleString()}${u}</span>`).join("")}</span><span class="chev"></span></summary>
     <div class="covgrid">${src.map(bar).join("")}<div class="covaxis"><span>2020</span><span>2021</span><span>2022</span><span>2023</span><span>2024</span><span>2025</span><span>오늘</span></div></div></details>
   <dl class="kpis"><div><dt>총 거리</dt><dd>2,411<small>km</small></dd></div><div><dt>러닝</dt><dd>226<small>회</small></dd></div><div><dt>평균 페이스</dt><dd>5:21<small>/km</small></dd></div><div><dt>최고 VO2max</dt><dd>49.8</dd></div><div><dt>평균 안정시 심박</dt><dd>47<small>bpm</small></dd></div><div><dt>평균 수면 점수</dt><dd>77<small>점</small></dd></div><div><dt>기간 말 체중</dt><dd>71.4<small>kg</small></dd></div></dl>
   <div class="stub">↓ 12개월 밀착 인화 (#394 시안 그대로)</div>`; }

function render(){ const r=route(); document.documentElement.style.setProperty("--m",M[r.metric].c);
  document.getElementById("app").innerHTML=r.page==="history"?historyPage(r):controls(r)+(r.view==="series"?seriesView(r):r.view==="records"?recordsView(r):otherView(r)); }
addEventListener("hashchange",render); addEventListener("resize",render); render();
</script>
