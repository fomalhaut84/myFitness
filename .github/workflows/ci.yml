name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  lint-typecheck-build:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: myfitness_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [20.x]

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/myfitness_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # #364: 회귀 검증 스크립트는 CI 에 걸어야 의미가 있다. lint 는 `eslint src/` 라
      # scripts/ 를 보지 않고, 추가만 해두면 아무도 실행하지 않는다 (사전 리뷰 P0).
      # workflow.md 7단계가 참조하던 `npm run test` 도 실재하지 않아 함께 신설.
      # DB 불필요 — build 앞에 두어 빠르게 실패시킨다.
      - name: Test — 회귀 검증 스크립트
        run: npm test

      - name: Build
        run: npm run build
